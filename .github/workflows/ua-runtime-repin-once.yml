name: UA Runtime Repin One-Shot

on:
  push:
    branches:
      - jolly/github-relay-p4-ua-stable-task-repin

permissions:
  contents: read

jobs:
  repin:
    if: github.event.head_commit.message == 'Add one-shot UA runtime repin'
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: jolly/github-relay-p4-ua-stable-task-repin
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Repin live Relay runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const fs = require('node:fs');
          const oldSha = '9f02f1963bf5f7e70d220a5e0171cbdfc542d8f6';
          const newSha = '919731e1df07e8263c1fb7246ca80ae31ed3bae4';
          for (const file of [
            '.github/workflows/kneekura-github-relay.yml',
            'test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs'
          ]) {
            let text = fs.readFileSync(file, 'utf8');
            const count = text.split(oldSha).length - 1;
            if (count !== 1) throw new Error(`${file}: expected exactly one old runtime pin, got ${count}`);
            text = text.replace(oldSha, newSha);
            fs.writeFileSync(file, text, 'utf8');
          }
          '@ | node
      - name: Run focused Relay workflow tests
        run: node --test test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs test/kneekura-code-lab-github-relay-p4-ua-prep.test.mjs test/kneekura-code-lab-github-relay-p4-ua-stable-task-identity.test.mjs
      - name: Commit repin and remove one-shot with local GitHub auth
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gh = Get-Command gh -ErrorAction Stop
          $token = (& $gh.Source auth token --hostname github.com).Trim()
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Authenticated GitHub CLI token unavailable' }
          Write-Host "::add-mask::$token"
          & $gh.Source auth setup-git --hostname github.com
          git config user.name 'KNEEKURA Relay Maintenance'
          git config user.email 'relay-maintenance@users.noreply.github.com'
          git rm .github/workflows/ua-runtime-repin-once.yml
          git add .github/workflows/kneekura-github-relay.yml test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs
          git commit -m 'Repin live Relay to UA-stable runtime'
          git push origin HEAD:jolly/github-relay-p4-ua-stable-task-repin
          $token = $null
