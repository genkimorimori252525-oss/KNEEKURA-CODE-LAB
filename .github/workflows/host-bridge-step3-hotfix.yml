name: Host Bridge Step 3 Hotfix

on:
  push:
    branches:
      - jolly/plugin-host-bridge-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install transient Host Bridge hotfix applier'
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify expected parent
        shell: powershell
        run: |
          $parent = (git rev-parse HEAD^).Trim().ToLowerInvariant()
          if ($parent -ne '02782d470e16832a9357ec822221018ccea669bb') { throw "Unexpected parent: $parent" }
      - name: Apply bounded source correction
        run: node scripts/apply-host-bridge-step3-hotfix.mjs
      - name: Commit corrected source and remove transient applier
        shell: powershell
        run: |
          git config user.name 'kneekura-love-github-edition[bot]'
          git config user.email 'kneekura-love-github-edition[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Host Bridge exact snapshot and replay attempts'
          git push origin HEAD:jolly/plugin-host-bridge-v1