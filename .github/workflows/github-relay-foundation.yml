name: GitHub Relay Foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/github-relay/**'
      - 'scripts/run-kneekura-github-relay.mjs'
      - 'scripts/publish-kneekura-github-relay.mjs'
      - 'test/kneekura-code-lab-github-relay-*.test.mjs'
      - 'docs/github-relay-v1.md'
      - 'package.json'
      - '.github/workflows/github-relay-foundation.yml'
      - '.github/workflows/kneekura-github-relay.yml'

permissions:
  contents: read

jobs:
  relay-foundation:
    # self-hosted の Windows ランナー（JollyRunnerHub / kneekura-code-lab）で回す
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check GitHub Relay scripts
        run: |
          node --check scripts/run-kneekura-github-relay.mjs
          node --check scripts/publish-kneekura-github-relay.mjs
      - name: Run GitHub Relay tests
        run: |
          # PowerShell は glob を展開しないので、自分でファイル一覧を作る
          $files = Get-ChildItem -Path test/kneekura-code-lab-github-relay-*.test.mjs | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'relay test files not found' }
          node --test @files
