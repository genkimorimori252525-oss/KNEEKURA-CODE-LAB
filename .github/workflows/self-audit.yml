name: Self Audit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA or ref to audit
        required: false
        default: ''
  push:
    paths:
      - 'scripts/self-audit.mjs'
      - 'test/self-audit-dogfood.test.mjs'
      - 'test/javascript-analysis.test.mjs'
      - '.github/workflows/self-audit.yml'
      - 'src/core/**'
      - 'src/analyzers/javascript.mjs'
      - 'src/adapters/jolly-research-mailbox*.mjs'
      - 'src/mailbox.mjs'

permissions:
  contents: read

jobs:
  self-audit:
    # self-hosted の Windows ランナー（JollyRunnerHub / kneekura-code-lab）で回す
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve dogfood target
        id: target
        shell: powershell
        run: |
          $requested = "${{ github.event.inputs.commit }}"
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            $target = (git rev-parse --verify "$requested^{commit}").Trim()
          } elseif ($env:GITHUB_REF_NAME -eq 'main') {
            $target = (git rev-parse HEAD).Trim()
          } else {
            $target = (git merge-base HEAD origin/main).Trim()
          }
          "commit=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Self-audit target: $target"
      - name: Run KNEEKURA self audit
        run: node scripts/self-audit.mjs --repo . --commit "${{ steps.target.outputs.commit }}"
