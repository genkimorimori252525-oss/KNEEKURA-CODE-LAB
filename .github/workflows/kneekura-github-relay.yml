name: KNEEKURA Code LAB GitHub Relay

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kneekura-code-lab-relay-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        name: Gate authorized Relay event
        shell: bash
        env:
          KNEEKURA_RELAY_ALLOWED_ACTORS: ${{ vars.KNEEKURA_RELAY_ALLOWED_ACTORS }}
          KNEEKURA_RELAY_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const owner = String(process.env.KNEEKURA_RELAY_REPOSITORY_OWNER || '').trim().toLowerCase();
          const configured = String(process.env.KNEEKURA_RELAY_ALLOWED_ACTORS || owner)
            .split(',')
            .map(value => value.trim().toLowerCase())
            .filter(Boolean);
          const allowed = new Set(configured.length ? configured : [owner]);
          const sender = String(event?.sender?.login || '').trim().toLowerCase();
          const firstLine = value => String(value || '').replace(/\r\n?/g, '\n').trimStart().split('\n', 1)[0].trim();
          let run = false;
          if (!event?.issue?.pull_request && allowed.has(sender)) {
            if (process.env.GITHUB_EVENT_NAME === 'issues' && event.action === 'opened') {
              run = firstLine(event.issue?.body) === 'KNEEKURA_RELAY_REQUEST_V1';
            } else if (process.env.GITHUB_EVENT_NAME === 'issue_comment' && event.action === 'created') {
              const marker = firstLine(event.comment?.body);
              run = marker === 'KNEEKURA_RELAY_RESPONSE_V1' || marker === 'KNEEKURA_RELAY_SOURCE_REQUEST_V1';
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run ? 'true' : 'false'}\n`);
          NODE

  execute:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 60
    steps:
      - name: Checkout pinned Relay runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f370f70e99e7cab30f89297c042091ad52a03220
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Load explicit Relay repository credential
        shell: powershell
        env:
          KNEEKURA_RELAY_EXPLICIT_TOKEN: ${{ secrets.KNEEKURA_RELAY_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KNEEKURA_RELAY_EXPLICIT_TOKEN)) { exit 0 }
          Write-Host "::add-mask::$env:KNEEKURA_RELAY_EXPLICIT_TOKEN"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$env:KNEEKURA_RELAY_EXPLICIT_TOKEN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve same-owner credential from GitHub CLI
        shell: powershell
        env:
          KNEEKURA_RELAY_REPOSITORY_OWNER: ${{ github.repository_owner }}
          KNEEKURA_RELAY_CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:KNEEKURA_RELAY_GITHUB_TOKEN)) { exit 0 }

          $event = Get-Content -Raw -Encoding UTF8 -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $body = [string]$event.issue.body
          $match = [regex]::Match($body, '(?s)^\s*KNEEKURA_RELAY_REQUEST_V1\s+```json\s*(\{.*\})\s*```\s*$')
          if (-not $match.Success) { exit 0 }
          $request = $match.Groups[1].Value | ConvertFrom-Json
          $target = [string]$request.target.repository
          if ($target -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { exit 0 }
          $parts = $target.Split('/')
          if ($parts[0].ToLowerInvariant() -ne $env:KNEEKURA_RELAY_REPOSITORY_OWNER.ToLowerInvariant()) { exit 0 }
          if ($target.ToLowerInvariant() -eq $env:KNEEKURA_RELAY_CURRENT_REPOSITORY.ToLowerInvariant()) { exit 0 }

          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $ghCommand) { exit 0 }

          $tokenProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $tokenProcessInfo.FileName = $ghCommand.Source
          $tokenProcessInfo.Arguments = 'auth token --hostname github.com'
          $tokenProcessInfo.UseShellExecute = $false
          $tokenProcessInfo.CreateNoWindow = $true
          $tokenProcessInfo.RedirectStandardOutput = $true
          $tokenProcessInfo.RedirectStandardError = $true
          $tokenProcess = New-Object System.Diagnostics.Process
          $tokenProcess.StartInfo = $tokenProcessInfo
          if (-not $tokenProcess.Start()) { exit 0 }
          $tokenOutput = $tokenProcess.StandardOutput.ReadToEnd()
          $tokenError = $tokenProcess.StandardError.ReadToEnd()
          $tokenProcess.WaitForExit()
          if ($tokenProcess.ExitCode -ne 0) {
            $tokenOutput = $null
            $tokenError = $null
            exit 0
          }

          $ghToken = [string]$tokenOutput
          $ghToken = $ghToken.Trim()
          if ([string]::IsNullOrWhiteSpace($ghToken)) {
            $tokenOutput = $null
            $tokenError = $null
            exit 0
          }

          Write-Host "::add-mask::$ghToken"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$ghToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ghToken = $null
          $tokenOutput = $null
          $tokenError = $null
      - id: engine_prep
        name: Resolve Relay engine preparation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $selection = ''
          $event = Get-Content -Raw -Encoding UTF8 -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $body = [string]$event.issue.body
          $match = [regex]::Match($body, '(?s)^\s*KNEEKURA_RELAY_REQUEST_V1\s+```json\s*(\{.*\})\s*```\s*$')
          if ($match.Success) {
            try {
              $request = $match.Groups[1].Value | ConvertFrom-Json
              $candidate = [string]$request.selection
              if ($candidate -in @('kneekura', 'understand-anything', 'archify', 'all')) { $selection = $candidate }
            } catch {
              $selection = ''
            }
          }
          "selection=$selection" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Prepare pinned Archify v2.16.0 when requested
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -Raw -Encoding UTF8 -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $body = [string]$event.issue.body
          $match = [regex]::Match($body, '(?s)^\s*KNEEKURA_RELAY_REQUEST_V1\s+```json\s*(\{.*\})\s*```\s*$')
          if (-not $match.Success) { exit 0 }
          $request = $match.Groups[1].Value | ConvertFrom-Json
          $selection = [string]$request.selection
          if ($selection -ne 'archify') { exit 0 }

          $expected = '4c59fa6557a2385beaaef8c7219cc414573acc9f0c30a932d5053b0b20689a46'
          $cacheRoot = Join-Path $env:USERPROFILE '.kneekura-code-lab\engine-cache'
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          $cacheZip = Join-Path $cacheRoot 'archify-v2.16.0-4c59fa6557a2385beaaef8c7219cc414573acc9f0c30a932d5053b0b20689a46.zip'

          if (Test-Path $cacheZip) {
            $cached = (Get-FileHash -Algorithm SHA256 $cacheZip).Hash.ToLowerInvariant()
            if ($cached -ne $expected) { Remove-Item -Force $cacheZip }
          }
          if (-not (Test-Path $cacheZip)) {
            $tmpZip = "$cacheZip.$env:GITHUB_RUN_ID.tmp"
            if (Test-Path $tmpZip) { Remove-Item -Force $tmpZip }
            try {
              Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tt-a1i/archify/c826e6c3a7abad19c0f3cd1ca57207d54b1ad8de/archify.zip' -OutFile $tmpZip
              $downloaded = (Get-FileHash -Algorithm SHA256 $tmpZip).Hash.ToLowerInvariant()
              if ($downloaded -ne $expected) { throw "Pinned Archify sha256 mismatch: $downloaded" }
              Move-Item -Force $tmpZip $cacheZip
            } finally {
              if (Test-Path $tmpZip) { Remove-Item -Force $tmpZip }
            }
          }

          $actual = (Get-FileHash -Algorithm SHA256 $cacheZip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Archify cache sha256 mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP "kneekura-relay-archify-v2.16.0-$env:GITHUB_RUN_ID"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -LiteralPath $cacheZip -DestinationPath $dest -Force
          $cli = Get-ChildItem -Path $dest -Recurse -File -Filter 'archify.mjs' | Where-Object { $_.FullName -match '[\\/]bin[\\/]archify\.mjs$' } | Select-Object -First 1
          if (-not $cli) { throw 'Pinned Archify CLI missing after extraction' }
          $archifyRoot = Split-Path -Parent (Split-Path -Parent $cli.FullName)
          "KNEEKURA_ARCHIFY_ROOT=$archifyRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KNEEKURA_ARCHIFY_ARTIFACT_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned Code LAB dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use Node 22 for pinned Understand Anything when requested
        if: steps.engine_prep.outputs.selection == 'understand-anything'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare pinned Understand Anything v2.9.0 when requested
        if: steps.engine_prep.outputs.selection == 'understand-anything'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-kneekura-relay-ua.ps1
      - id: relay
        name: Execute one disposable Relay turn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNEEKURA_RELAY_ALLOWED_ACTORS: ${{ vars.KNEEKURA_RELAY_ALLOWED_ACTORS }}
          KNEEKURA_RELAY_COMPATIBLE_PLAN_CODE_LAB_REVISIONS: 919731e1df07e8263c1fb7246ca80ae31ed3bae4
        run: node scripts/run-kneekura-github-relay.mjs
      - id: task_payload
        name: Upload Relay task payload artifact
        if: steps.relay.outcome == 'success' && steps.relay.outputs.has_task_payload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.relay.outputs.task_payload_artifact_name }}
          path: ${{ steps.relay.outputs.task_payload_artifact_path }}
          if-no-files-found: error
          retention-days: 14
      - id: artifact
        name: Upload sealed Relay artifact
        if: steps.relay.outcome == 'success' && steps.relay.outputs.has_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.relay.outputs.artifact_name }}
          path: ${{ steps.relay.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded Relay comments
        if: >-
          always() &&
          steps.relay.outputs.turn_file != '' &&
          (
            steps.relay.outcome == 'failure' ||
            (
              (steps.relay.outputs.has_task_payload_artifact != 'true' || steps.task_payload.outcome == 'success') &&
              (steps.relay.outputs.has_artifact != 'true' || steps.artifact.outcome == 'success')
            )
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNEEKURA_RELAY_TURN_FILE: ${{ steps.relay.outputs.turn_file }}
        run: node scripts/publish-kneekura-github-relay.mjs