name: Relay P3d5 Repin One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-p3d5-repin-runtime
    paths:
      - .github/workflows/relay-p3d5-repin-once.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: jolly/github-relay-v1-p3d5-repin-runtime
          fetch-depth: 0
      - name: Repin live Relay runtime to merged target-fetch fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const oldPin = 'f2df98f8a2318d40348b4c52ef0a8f47b02c24f7';
          const newPin = '840996d7b5168781624635220609aa5406057c34';
          const files = [
            '.github/workflows/kneekura-github-relay.yml',
            'test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs'
          ];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            const count = text.split(oldPin).length - 1;
            if (count !== 1) throw new Error(`${file}: expected exactly one old runtime pin, found ${count}`);
            fs.writeFileSync(file, text.replace(oldPin, newPin), 'utf8');
          }
          NODE
          node --test test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs test/kneekura-code-lab-github-relay-p3d5-target-fetch-token-isolation.test.mjs
          rm .github/workflows/relay-p3d5-repin-once.yml
          git config user.name "KNEEKURA Relay Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/kneekura-github-relay.yml test/kneekura-code-lab-github-relay-p3b-workflow.test.mjs .github/workflows/relay-p3d5-repin-once.yml
          git commit -m "Repin live Relay to target fetch token isolation fix"
          git push origin HEAD:jolly/github-relay-v1-p3d5-repin-runtime
