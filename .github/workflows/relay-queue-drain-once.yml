name: Relay Queue Drain One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-queue-drain

permissions:
  actions: write
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel queue-drain branch CI only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          DRAIN_BRANCH: jolly/github-relay-v1-queue-drain
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const branch = process.env.DRAIN_BRANCH;
          if (!repo || !token || !branch) throw new Error('GitHub context missing');

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kneekura-relay-queue-drain-once'
          };

          // Give GitHub's Actions index a moment to expose the CI run created by
          // this same push. This job itself is GitHub-hosted and is never selected.
          await new Promise(resolve => setTimeout(resolve, 3000));

          const candidates = [];
          for (const status of ['queued', 'in_progress']) {
            const url = `https://api.github.com/repos/${repo}/actions/runs?branch=${encodeURIComponent(branch)}&status=${status}&per_page=100`;
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`list runs failed: HTTP ${response.status}`);
            const payload = await response.json();
            candidates.push(...(Array.isArray(payload.workflow_runs) ? payload.workflow_runs : []));
          }

          const selected = candidates.filter(run =>
            run.name === 'CI' &&
            run.head_branch === branch &&
            ['queued', 'in_progress'].includes(run.status)
          );

          console.log(`Selected ${selected.length} queue-drain CI run(s) for force-cancel.`);
          for (const run of selected) {
            const response = await fetch(
              `https://api.github.com/repos/${repo}/actions/runs/${run.id}/force-cancel`,
              { method: 'POST', headers }
            );
            if (![202, 409].includes(response.status)) {
              throw new Error(`force-cancel ${run.id} failed: HTTP ${response.status}`);
            }
            console.log(`Force-cancel requested for queue-drain CI ${run.id}.`);
          }
          NODE

# one-shot: drain-own-ci-backlog
