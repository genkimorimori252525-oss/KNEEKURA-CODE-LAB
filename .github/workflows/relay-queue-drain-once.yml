name: Relay Queue Drain One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-queue-drain

permissions:
  actions: write
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel bounded Relay maintenance runs only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          if (!repo || !token) throw new Error('GitHub context missing');
          const maintenanceBranches = new Set([
            'jolly/github-relay-v1-queue-drain',
            'jolly/github-relay-v1-credential-diag',
            'jolly/github-relay-v1-p3d5-strip-actions-token',
            'jolly/github-relay-v1-p3d5-repin-runtime',
            'jolly/github-relay-v1-p3e-stable-task-identity'
          ]);
          const exactRunIds = new Set([34624879049, 34625197069]);
          const headers = {Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'kneekura-relay-queue-drain-once'};
          await new Promise(resolve => setTimeout(resolve, 3000));
          const candidates = [];
          for (const status of ['queued','in_progress']) {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs?status=${status}&per_page=100`, {headers});
            if (!response.ok) throw new Error(`list runs failed: HTTP ${response.status}`);
            const payload = await response.json();
            candidates.push(...(Array.isArray(payload.workflow_runs) ? payload.workflow_runs : []));
          }
          const selected = candidates.filter(run => (((run.name === 'CI') && maintenanceBranches.has(String(run.head_branch || ''))) || exactRunIds.has(Number(run.id))) && ['queued','in_progress'].includes(run.status));
          console.log(`Selected ${selected.length} explicitly bounded run(s) for force-cancel.`);
          for (const run of selected) {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${run.id}/force-cancel`, {method:'POST',headers});
            if (![202,409].includes(response.status)) throw new Error(`force-cancel ${run.id} failed: HTTP ${response.status}`);
            console.log(`Force-cancel requested for bounded run ${run.id}.`);
          }
          NODE

# one-shot: free-runner-for-ua-114-task2
