name: Relay Queue Drain One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-queue-drain

permissions:
  actions: write
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete Relay-development runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          KEEP_DIAGNOSTIC_RUN_ID: '34500507908'
          CANCEL_OLD_DIAGNOSTIC_RUN_ID: '34499777724'
          CANCEL_EXACT_MAIN_CI_RUN_ID: '34501067977'
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const keepDiagnostic = Number(process.env.KEEP_DIAGNOSTIC_RUN_ID);
          const oldDiagnostic = Number(process.env.CANCEL_OLD_DIAGNOSTIC_RUN_ID);
          const exactMainCiRun = Number(process.env.CANCEL_EXACT_MAIN_CI_RUN_ID);
          if (!repo || !token) throw new Error('GitHub context missing');

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kneekura-relay-queue-drain-once'
          };

          const candidates = [];
          for (const status of ['queued', 'in_progress']) {
            for (let page = 1; page <= 10; page += 1) {
              const url = `https://api.github.com/repos/${repo}/actions/runs?status=${status}&per_page=100&page=${page}`;
              const response = await fetch(url, { headers });
              if (!response.ok) throw new Error(`list runs failed: HTTP ${response.status}`);
              const payload = await response.json();
              const runs = Array.isArray(payload.workflow_runs) ? payload.workflow_runs : [];
              candidates.push(...runs);
              if (runs.length < 100) break;
            }
          }

          const selected = new Map();
          for (const run of candidates) {
            const id = Number(run.id);
            if (!Number.isSafeInteger(id) || id === keepDiagnostic) continue;
            const obsoleteRelayCi =
              run.name === 'CI' &&
              String(run.head_branch || '').startsWith('jolly/github-relay-v1');
            const obsoleteDiagnostic =
              id === oldDiagnostic &&
              run.name === 'Relay Credential Diagnostic One-Shot';
            const exactMainCi =
              id === exactMainCiRun &&
              run.name === 'CI' &&
              run.head_branch === 'main' &&
              run.head_sha === '967911451fe5ec87e17bb7791f03283289f3b9bc';
            if (obsoleteRelayCi || obsoleteDiagnostic || exactMainCi) selected.set(id, run);
          }

          console.log(`Selected ${selected.size} obsolete run(s) for cancellation.`);
          for (const [id, run] of selected) {
            console.log(`Cancel ${id}: ${run.name} / ${run.head_branch} / ${run.status}`);
            const response = await fetch(
              `https://api.github.com/repos/${repo}/actions/runs/${id}/cancel`,
              { method: 'POST', headers }
            );
            if (![202, 409].includes(response.status)) {
              throw new Error(`cancel ${id} failed: HTTP ${response.status}`);
            }
          }
          NODE

# rerun: prioritize-p3d5-live-relay
