name: Relay Queue Drain One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-queue-drain

permissions:
  actions: write
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel exact stuck obsolete Relay CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          STUCK_RUN_ID: '34500892276'
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const id = Number(process.env.STUCK_RUN_ID);
          if (!repo || !token || !Number.isSafeInteger(id)) throw new Error('GitHub context missing');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kneekura-relay-queue-drain-once'
          };
          const runResponse = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}`, { headers });
          if (!runResponse.ok) throw new Error(`read run failed: HTTP ${runResponse.status}`);
          const run = await runResponse.json();
          const safeTarget =
            run.name === 'CI' &&
            run.head_branch === 'jolly/github-relay-v1-p3d5-gh-token' &&
            run.head_sha === 'e1fe293b2001f32a40b56eb6fff1f66d4c21013b';
          if (!safeTarget) throw new Error('refusing to force-cancel unexpected run identity');
          if (!['queued', 'in_progress'].includes(run.status)) {
            console.log(`Run ${id} already terminal: ${run.status}/${run.conclusion}`);
            process.exit(0);
          }
          const response = await fetch(
            `https://api.github.com/repos/${repo}/actions/runs/${id}/force-cancel`,
            { method: 'POST', headers }
          );
          if (![202, 409].includes(response.status)) {
            throw new Error(`force-cancel ${id} failed: HTTP ${response.status}`);
          }
          console.log(`Force-cancel requested for exact obsolete CI ${id}.`);
          NODE

# one-shot: force-cancel-stuck-p3d5-ci
