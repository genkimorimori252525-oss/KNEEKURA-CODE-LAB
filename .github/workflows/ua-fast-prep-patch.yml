name: UA Fast Prep One-Shot Patch

on:
  push:
    branches:
      - jolly/github-relay-p4-ua-fast-prep

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: jolly/github-relay-p4-ua-fast-prep
          fetch-depth: 1
      - name: Replace inline UA preparation with verified script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/kneekura-github-relay.yml')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r"      - name: Prepare pinned Understand Anything v2\.9\.0 when requested\n.*?(?=      - id: relay\n)", re.S)
          replacement = """      - name: Prepare pinned Understand Anything v2.9.0 when requested
        if: steps.engine_prep.outputs.selection == 'understand-anything'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-kneekura-relay-ua.ps1
"""
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'expected one UA prep block, replaced {count}')
          p.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/kneekura-github-relay.yml
      - name: Commit patch
        shell: bash
        env:
          BRANCH: jolly/github-relay-p4-ua-fast-prep
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/kneekura-github-relay.yml
          git commit -m 'Use verified fast UA Relay preparation'
          git push origin HEAD:$BRANCH
