name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 5
    steps:
      - name: Probe current runner auth paths without exposing values
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRepository = 'genkimorimori252525-oss/KNEEKURA-LAB'
          $targetSha = 'e96e40ab0fc7a8995a1972d8f9defb2aa894ad0e'
          Write-Host ('runner.temp.drive=' + ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)))

          $helpers = @(& git config --global --get-all credential.helper 2>$null)
          $useHttpPathGlobal = (& git config --global --get credential.useHttpPath 2>$null)
          $useHttpPathGithub = (& git config --global --get credential.https://github.com.useHttpPath 2>$null)
          Write-Host ('credential.helper.count=' + $helpers.Count)
          Write-Host ('credential.useHttpPath.global=' + $(if ($useHttpPathGlobal) { $useHttpPathGlobal.Trim() } else { '<unset>' }))
          Write-Host ('credential.useHttpPath.github=' + $(if ($useHttpPathGithub) { $useHttpPathGithub.Trim() } else { '<unset>' }))

          function Probe-Credential([string[]]$Lines, [string]$Label) {
            $oldTerminal = $env:GIT_TERMINAL_PROMPT
            $oldInteractive = $env:GCM_INTERACTIVE
            try {
              $env:GIT_TERMINAL_PROMPT = '0'
              $env:GCM_INTERACTIVE = 'Never'
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = 'git'
              $psi.Arguments = 'credential fill'
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true
              $psi.RedirectStandardInput = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $p = New-Object System.Diagnostics.Process
              $p.StartInfo = $psi
              if (-not $p.Start()) { Write-Host "$Label.start=false"; return }
              foreach ($line in $Lines) { $p.StandardInput.WriteLine($line) }
              $p.StandardInput.WriteLine('')
              $p.StandardInput.Close()
              $stdout = $p.StandardOutput.ReadToEnd()
              $stderr = $p.StandardError.ReadToEnd()
              $p.WaitForExit()
              $keys = @($stdout -split "`r?`n" | Where-Object { $_ -match '^[A-Za-z][A-Za-z0-9_-]*=' } | ForEach-Object { ($_ -split '=', 2)[0].ToLowerInvariant() })
              Write-Host "$Label.exit=$($p.ExitCode)"
              Write-Host "$Label.protocol=$($keys -contains 'protocol')"
              Write-Host "$Label.host=$($keys -contains 'host')"
              Write-Host "$Label.username=$($keys -contains 'username')"
              Write-Host "$Label.password=$($keys -contains 'password')"
              Write-Host "$Label.stderr_present=$(-not [string]::IsNullOrWhiteSpace($stderr))"
              $stdout = $null
              $stderr = $null
              $keys = $null
            } finally {
              $env:GIT_TERMINAL_PROMPT = $oldTerminal
              $env:GCM_INTERACTIVE = $oldInteractive
            }
          }

          function Probe-Fetch([string]$Label, [bool]$DisableAllInteraction) {
            $dest = Join-Path $env:RUNNER_TEMP ("kneekura-relay-auth-probe-" + $Label)
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            New-Item -ItemType Directory -Path $dest | Out-Null
            & git -C $dest init --quiet
            & git -C $dest remote add origin ("https://github.com/" + $targetRepository + ".git")
            $oldTerminal = $env:GIT_TERMINAL_PROMPT
            $oldInteractive = $env:GCM_INTERACTIVE
            $oldGui = $env:GCM_GUI_PROMPT
            try {
              $env:GIT_TERMINAL_PROMPT = '0'
              if ($DisableAllInteraction) {
                $env:GCM_INTERACTIVE = 'Never'
                Remove-Item Env:GCM_GUI_PROMPT -ErrorAction SilentlyContinue
              } else {
                Remove-Item Env:GCM_INTERACTIVE -ErrorAction SilentlyContinue
                $env:GCM_GUI_PROMPT = '0'
              }
              $null = & git -c core.hooksPath=NUL -C $dest fetch --depth 1 --no-tags origin $targetSha 2>$null
              $exit = $LASTEXITCODE
              $exact = $false
              if ($exit -eq 0) {
                $actual = (& git -C $dest rev-parse FETCH_HEAD 2>$null).Trim().ToLowerInvariant()
                $type = (& git --no-replace-objects -C $dest cat-file -t $targetSha 2>$null).Trim()
                $exact = ($actual -eq $targetSha -and $type -eq 'commit')
              }
              Write-Host "$Label.exit=$exit"
              Write-Host "$Label.exact_commit=$exact"
            } finally {
              if ($null -eq $oldTerminal) { Remove-Item Env:GIT_TERMINAL_PROMPT -ErrorAction SilentlyContinue } else { $env:GIT_TERMINAL_PROMPT = $oldTerminal }
              if ($null -eq $oldInteractive) { Remove-Item Env:GCM_INTERACTIVE -ErrorAction SilentlyContinue } else { $env:GCM_INTERACTIVE = $oldInteractive }
              if ($null -eq $oldGui) { Remove-Item Env:GCM_GUI_PROMPT -ErrorAction SilentlyContinue } else { $env:GCM_GUI_PROMPT = $oldGui }
              Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
            }
          }

          Probe-Credential @('protocol=https', 'host=github.com') 'credential.host_only'
          Probe-Credential @('protocol=https', 'host=github.com', 'path=genkimorimori252525-oss/KNEEKURA-LAB.git') 'credential.target_path_git'
          Probe-Credential @('protocol=https', 'host=github.com', 'path=genkimorimori252525-oss/KNEEKURA-LAB') 'credential.target_path_plain'

          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          Write-Host ('gh.present=' + [bool]$ghCommand)
          if ($ghCommand) {
            $ghToken = (& gh auth token --hostname github.com 2>$null)
            $ghExit = $LASTEXITCODE
            $ghTokenPresent = ($ghExit -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$ghToken))
            if ($ghTokenPresent) { Write-Host "::add-mask::$ghToken" }
            Write-Host "gh.auth_token.exit=$ghExit"
            Write-Host "gh.auth_token.present=$ghTokenPresent"
            $ghToken = $null
          }

          Probe-Fetch 'fetch.noninteractive' $true
          Probe-Fetch 'fetch.no_gui_auto' $false
