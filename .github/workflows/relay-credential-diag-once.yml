name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 5
    steps:
      - name: Compare exact private-target auth paths without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRepository = 'genkimorimori252525-oss/KNEEKURA-LAB'
          $targetSha = 'e96e40ab0fc7a8995a1972d8f9defb2aa894ad0e'

          function Invoke-ExactFetch([string]$Label, [string]$Token, [bool]$UseAskpass) {
            $dest = Join-Path $env:RUNNER_TEMP ("kneekura-relay-auth-probe-" + $Label)
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            New-Item -ItemType Directory -Path $dest | Out-Null
            & git -C $dest init --quiet
            & git -C $dest remote add origin ("https://github.com/" + $targetRepository + ".git")

            $oldTerminal = $env:GIT_TERMINAL_PROMPT
            $oldInteractive = $env:GCM_INTERACTIVE
            $oldAskpass = $env:GIT_ASKPASS
            $oldFetchToken = $env:KNEEKURA_RELAY_FETCH_TOKEN
            $askpass = Join-Path $dest '.kneekura-relay-askpass.cmd'
            try {
              $env:GIT_TERMINAL_PROMPT = '0'
              $env:GCM_INTERACTIVE = 'Never'
              if ($UseAskpass) {
                Set-Content -LiteralPath $askpass -Encoding ASCII -Value @(
                  '@echo off',
                  'echo %* | findstr /I "Username" >nul && (echo x-access-token& exit /b 0)',
                  'echo %KNEEKURA_RELAY_FETCH_TOKEN%'
                )
                $env:GIT_ASKPASS = $askpass
                $env:KNEEKURA_RELAY_FETCH_TOKEN = $Token
              } else {
                Remove-Item Env:GIT_ASKPASS -ErrorAction SilentlyContinue
                Remove-Item Env:KNEEKURA_RELAY_FETCH_TOKEN -ErrorAction SilentlyContinue
              }

              $savedPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try {
                $null = & git -c core.hooksPath=NUL -C $dest fetch --depth 1 --no-tags origin $targetSha 2>$null
                $exit = $LASTEXITCODE
              } finally {
                $ErrorActionPreference = $savedPreference
              }

              $exact = $false
              if ($exit -eq 0) {
                $actual = (& git -C $dest rev-parse FETCH_HEAD 2>$null).Trim().ToLowerInvariant()
                $type = (& git --no-replace-objects -C $dest cat-file -t $targetSha 2>$null).Trim()
                $exact = ($actual -eq $targetSha -and $type -eq 'commit')
              }
              Write-Host "$Label.exit=$exit"
              Write-Host "$Label.exact_commit=$exact"
            } finally {
              if ($null -eq $oldTerminal) { Remove-Item Env:GIT_TERMINAL_PROMPT -ErrorAction SilentlyContinue } else { $env:GIT_TERMINAL_PROMPT = $oldTerminal }
              if ($null -eq $oldInteractive) { Remove-Item Env:GCM_INTERACTIVE -ErrorAction SilentlyContinue } else { $env:GCM_INTERACTIVE = $oldInteractive }
              if ($null -eq $oldAskpass) { Remove-Item Env:GIT_ASKPASS -ErrorAction SilentlyContinue } else { $env:GIT_ASKPASS = $oldAskpass }
              if ($null -eq $oldFetchToken) { Remove-Item Env:KNEEKURA_RELAY_FETCH_TOKEN -ErrorAction SilentlyContinue } else { $env:KNEEKURA_RELAY_FETCH_TOKEN = $oldFetchToken }
              Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
            }
          }

          $ghToken = (& gh auth token --hostname github.com 2>$null)
          $ghExit = $LASTEXITCODE
          $ghTokenPresent = ($ghExit -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$ghToken))
          if ($ghTokenPresent) { Write-Host "::add-mask::$ghToken" }
          Write-Host "gh.auth_token.exit=$ghExit"
          Write-Host "gh.auth_token.present=$ghTokenPresent"

          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $null = & gh api --silent ("repos/" + $targetRepository + "/commits/" + $targetSha) 2>$null
            $ghApiExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedPreference
          }
          Write-Host "gh.api.exact_commit.exit=$ghApiExit"

          Invoke-ExactFetch 'fetch.local_git_auth' $null $false
          if ($ghTokenPresent) {
            Invoke-ExactFetch 'fetch.runtime_askpass' ([string]$ghToken).Trim() $true
          } else {
            Write-Host 'fetch.runtime_askpass.skipped=true'
          }
          $ghToken = $null
