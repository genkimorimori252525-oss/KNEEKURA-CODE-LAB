name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Relay runtime exactly as live workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2df98f8a2318d40348b4c52ef0a8f47b02c24f7
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Resolve same-owner credential exactly as live workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $ghCommand) { throw 'gh unavailable' }
          $tokenProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $tokenProcessInfo.FileName = $ghCommand.Source
          $tokenProcessInfo.Arguments = 'auth token --hostname github.com'
          $tokenProcessInfo.UseShellExecute = $false
          $tokenProcessInfo.CreateNoWindow = $true
          $tokenProcessInfo.RedirectStandardOutput = $true
          $tokenProcessInfo.RedirectStandardError = $true
          $tokenProcess = New-Object System.Diagnostics.Process
          $tokenProcess.StartInfo = $tokenProcessInfo
          if (-not $tokenProcess.Start()) { throw 'gh token process failed to start' }
          $tokenOutput = $tokenProcess.StandardOutput.ReadToEnd()
          $tokenError = $tokenProcess.StandardError.ReadToEnd()
          $tokenProcess.WaitForExit()
          if ($tokenProcess.ExitCode -ne 0) { throw 'gh token process failed' }
          $ghToken = ([string]$tokenOutput).Trim()
          if ([string]::IsNullOrWhiteSpace($ghToken)) { throw 'gh token empty' }
          Write-Host "::add-mask::$ghToken"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$ghToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ghToken = $null
          $tokenOutput = $null
          $tokenError = $null
      - name: Install pinned Code LAB dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Add local-only bounded fetch diagnostics to pinned runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $patchFile = Join-Path $env:RUNNER_TEMP 'kneekura-relay-safe-fetch-patch.mjs'
          @'
          import fs from 'node:fs/promises';

          const file = 'scripts/run-kneekura-github-relay.mjs';
          const text = await fs.readFile(file, 'utf8');
          const before = `  } catch {
            throw codedError(
              'BLOCKED_TARGET_REPOSITORY_UNAVAILABLE',
              'relay runner could not fetch the exact target revision; configure KNEEKURA_RELAY_GITHUB_TOKEN for cross-private-repository access if needed'
            );
          } finally {`;
          const after = `  } catch (error) {
            const diagnosticPath = process.env.KNEEKURA_RELAY_FETCH_DIAG_PATH;
            if (diagnosticPath) {
              const stderrText = String(error?.stderr || '');
              const stderrLower = stderrText.toLowerCase();
              const diagnostic = {
                repository,
                revision,
                relay_token_present: Boolean(relayToken),
                selected_token_present: Boolean(token),
                status: Number.isInteger(error?.status) ? error.status : null,
                stderr_bytes: Buffer.byteLength(stderrText, 'utf8'),
                stderr_digest: 'sha256:' + crypto.createHash('sha256').update(stderrText).digest('hex'),
                authentication_failed: stderrLower.includes('authentication failed'),
                repository_not_found: stderrLower.includes('repository not found'),
                could_not_read_username: stderrLower.includes('could not read username'),
                could_not_read_password: stderrLower.includes('could not read password'),
                askpass_spawn_failed: stderrLower.includes('cannot spawn') || stderrLower.includes('could not run'),
                terminal_prompt_disabled: stderrLower.includes('terminal prompts disabled'),
                unable_to_access: stderrLower.includes('unable to access')
              };
              await fs.writeFile(diagnosticPath, JSON.stringify(diagnostic, null, 2) + '\n', 'utf8');
            }
            throw codedError(
              'BLOCKED_TARGET_REPOSITORY_UNAVAILABLE',
              'relay runner could not fetch the exact target revision; configure KNEEKURA_RELAY_GITHUB_TOKEN for cross-private-repository access if needed'
            );
          } finally {`;
          if (!text.includes(before)) throw new Error('expected pinned runtime catch block not found');
          await fs.writeFile(file, text.replace(before, after), 'utf8');
          '@ | Set-Content -LiteralPath $patchFile -Encoding UTF8
          try {
            node $patchFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $patchFile -ErrorAction SilentlyContinue
          }
      - name: Run full pinned Relay against real Issue 91 and classify fetch failure
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $issueFile = Join-Path $env:RUNNER_TEMP 'kneekura-relay-issue-91.json'
          $eventFile = Join-Path $env:RUNNER_TEMP 'kneekura-relay-event-91.json'
          $fetchDiag = Join-Path $env:RUNNER_TEMP 'kneekura-relay-fetch-diag.json'
          $savedEventPath = $env:GITHUB_EVENT_PATH
          $savedDiagPath = $env:KNEEKURA_RELAY_FETCH_DIAG_PATH
          try {
            & gh api 'repos/genkimorimori252525-oss/KNEEKURA-CODE-LAB/issues/91' | Out-File -LiteralPath $issueFile -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'failed to read Issue 91' }
            $issue = Get-Content -Raw -Encoding UTF8 -LiteralPath $issueFile | ConvertFrom-Json
            $event = [ordered]@{ action = 'opened'; issue = $issue; sender = $issue.user }
            $eventJson = $event | ConvertTo-Json -Depth 100
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($eventFile, $eventJson, $utf8NoBom)
            $env:GITHUB_EVENT_PATH = $eventFile
            $env:KNEEKURA_RELAY_FETCH_DIAG_PATH = $fetchDiag

            $savedPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & node scripts/run-kneekura-github-relay.mjs *> $null
              $relayExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedPreference
            }

            $turnPath = Join-Path $PWD 'dist\github-relay\turn.json'
            Write-Host "full_runtime.exit=$relayExit"
            Write-Host ('full_runtime.turn_exists=' + (Test-Path -LiteralPath $turnPath))
            if (Test-Path -LiteralPath $turnPath) {
              $turn = Get-Content -Raw -Encoding UTF8 -LiteralPath $turnPath | ConvertFrom-Json
              Write-Host ('full_runtime.failed=' + [bool]$turn.failed)
              Write-Host ('full_runtime.replay_state=' + [string]$turn.replay_state)
              $kinds = @($turn.comments | ForEach-Object { [string]$_.kind })
              Write-Host ('full_runtime.comment_kinds=' + ($kinds -join ','))
            }

            Write-Host ('fetch_diag.exists=' + (Test-Path -LiteralPath $fetchDiag))
            if (Test-Path -LiteralPath $fetchDiag) {
              $diag = Get-Content -Raw -Encoding UTF8 -LiteralPath $fetchDiag | ConvertFrom-Json
              Write-Host ('fetch_diag.repository=' + [string]$diag.repository)
              Write-Host ('fetch_diag.revision=' + [string]$diag.revision)
              Write-Host ('fetch_diag.relay_token_present=' + [bool]$diag.relay_token_present)
              Write-Host ('fetch_diag.selected_token_present=' + [bool]$diag.selected_token_present)
              Write-Host ('fetch_diag.status=' + [string]$diag.status)
              Write-Host ('fetch_diag.stderr_bytes=' + [string]$diag.stderr_bytes)
              Write-Host ('fetch_diag.stderr_digest=' + [string]$diag.stderr_digest)
              Write-Host ('fetch_diag.authentication_failed=' + [bool]$diag.authentication_failed)
              Write-Host ('fetch_diag.repository_not_found=' + [bool]$diag.repository_not_found)
              Write-Host ('fetch_diag.could_not_read_username=' + [bool]$diag.could_not_read_username)
              Write-Host ('fetch_diag.could_not_read_password=' + [bool]$diag.could_not_read_password)
              Write-Host ('fetch_diag.askpass_spawn_failed=' + [bool]$diag.askpass_spawn_failed)
              Write-Host ('fetch_diag.terminal_prompt_disabled=' + [bool]$diag.terminal_prompt_disabled)
              Write-Host ('fetch_diag.unable_to_access=' + [bool]$diag.unable_to_access)
            }
          } finally {
            $env:GITHUB_EVENT_PATH = $savedEventPath
            if ($null -eq $savedDiagPath) { Remove-Item Env:KNEEKURA_RELAY_FETCH_DIAG_PATH -ErrorAction SilentlyContinue } else { $env:KNEEKURA_RELAY_FETCH_DIAG_PATH = $savedDiagPath }
            Remove-Item -Force $issueFile,$eventFile,$fetchDiag -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force (Join-Path $PWD 'dist\github-relay') -ErrorAction SilentlyContinue
          }
          exit 0
