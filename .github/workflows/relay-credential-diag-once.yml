name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Relay runtime exactly as live workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2df98f8a2318d40348b4c52ef0a8f47b02c24f7
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Resolve same-owner credential exactly as live workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $ghCommand) { throw 'gh unavailable' }
          $tokenProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $tokenProcessInfo.FileName = $ghCommand.Source
          $tokenProcessInfo.Arguments = 'auth token --hostname github.com'
          $tokenProcessInfo.UseShellExecute = $false
          $tokenProcessInfo.CreateNoWindow = $true
          $tokenProcessInfo.RedirectStandardOutput = $true
          $tokenProcessInfo.RedirectStandardError = $true
          $tokenProcess = New-Object System.Diagnostics.Process
          $tokenProcess.StartInfo = $tokenProcessInfo
          if (-not $tokenProcess.Start()) { throw 'gh token process failed to start' }
          $tokenOutput = $tokenProcess.StandardOutput.ReadToEnd()
          $tokenError = $tokenProcess.StandardError.ReadToEnd()
          $tokenProcess.WaitForExit()
          if ($tokenProcess.ExitCode -ne 0) { throw 'gh token process failed' }
          $ghToken = ([string]$tokenOutput).Trim()
          if ([string]::IsNullOrWhiteSpace($ghToken)) { throw 'gh token empty' }
          Write-Host "::add-mask::$ghToken"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$ghToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ghToken = $null
          $tokenOutput = $null
          $tokenError = $null
      - name: Compare target fetch with and without Actions GITHUB_TOKEN
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'kneekura-relay-github-token-ab.mjs'
          @'
          import childProcess from 'node:child_process';
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const repository = 'genkimorimori252525-oss/KNEEKURA-LAB';
          const revision = 'e96e40ab0fc7a8995a1972d8f9defb2aa894ad0e';
          const relayToken = String(process.env.KNEEKURA_RELAY_GITHUB_TOKEN || '');
          console.log(`relay_token.present=${relayToken.length > 0}`);
          console.log(`actions_token.present=${Boolean(process.env.GITHUB_TOKEN)}`);
          if (!relayToken) process.exit(2);

          function classify(error) {
            const stderr = String(error?.stderr || '').toLowerCase();
            return {
              status: Number.isInteger(error?.status) ? error.status : null,
              repository_not_found: stderr.includes('repository not found'),
              authentication_failed: stderr.includes('authentication failed'),
              askpass_spawn_failed: stderr.includes('cannot spawn') || stderr.includes('could not run')
            };
          }

          async function probe(label, includeGithubToken) {
            const root = await fs.mkdtemp(path.join(os.tmpdir(), `kneekura-gh-token-ab-${label}-`));
            const target = path.join(root, 'target');
            await fs.mkdir(target, { recursive: true });
            const git = (cwd, args, env) => childProcess.execFileSync('git', ['-C', cwd, ...args], {
              encoding: 'utf8', windowsHide: true, stdio: ['ignore', 'pipe', 'pipe'], env
            });
            try {
              git(target, ['init'], process.env);
              git(target, ['remote', 'add', 'origin', `https://github.com/${repository}.git`], process.env);
              const askpass = path.join(target, '.kneekura-relay-askpass.cmd');
              await fs.writeFile(askpass, '@echo off\r\necho %* | findstr /I "Username" >nul && (echo x-access-token& exit /b 0)\r\necho %KNEEKURA_RELAY_FETCH_TOKEN%\r\n', 'utf8');
              const env = {
                ...process.env,
                GIT_TERMINAL_PROMPT: '0',
                GCM_INTERACTIVE: 'Never',
                GIT_ASKPASS: askpass,
                KNEEKURA_RELAY_FETCH_TOKEN: relayToken
              };
              if (!includeGithubToken) delete env.GITHUB_TOKEN;
              let error = null;
              try {
                git(target, ['-c', 'core.hooksPath=NUL', 'fetch', '--depth', '1', '--no-tags', 'origin', revision], env);
              } catch (caught) {
                error = caught;
              }
              if (error) {
                const c = classify(error);
                console.log(`${label}.ok=false`);
                console.log(`${label}.status=${c.status}`);
                console.log(`${label}.repository_not_found=${c.repository_not_found}`);
                console.log(`${label}.authentication_failed=${c.authentication_failed}`);
                console.log(`${label}.askpass_spawn_failed=${c.askpass_spawn_failed}`);
              } else {
                const actual = git(target, ['rev-parse', 'FETCH_HEAD'], env).trim().toLowerCase();
                const type = git(target, ['--no-replace-objects', 'cat-file', '-t', actual], env).trim();
                console.log(`${label}.ok=true`);
                console.log(`${label}.exact_commit=${actual === revision && type === 'commit'}`);
              }
            } finally {
              await fs.rm(root, { recursive: true, force: true }).catch(() => {});
            }
          }

          await probe('with_actions_token', true);
          await probe('without_actions_token', false);
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          try {
            node $probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $probe -ErrorAction SilentlyContinue
          }
