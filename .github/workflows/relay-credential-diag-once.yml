name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 5
    steps:
      - name: Checkout pinned Relay runtime exactly as live workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2df98f8a2318d40348b4c52ef0a8f47b02c24f7
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Resolve same-owner credential exactly as live workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $ghCommand) { throw 'gh unavailable' }

          $tokenProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $tokenProcessInfo.FileName = $ghCommand.Source
          $tokenProcessInfo.Arguments = 'auth token --hostname github.com'
          $tokenProcessInfo.UseShellExecute = $false
          $tokenProcessInfo.CreateNoWindow = $true
          $tokenProcessInfo.RedirectStandardOutput = $true
          $tokenProcessInfo.RedirectStandardError = $true
          $tokenProcess = New-Object System.Diagnostics.Process
          $tokenProcess.StartInfo = $tokenProcessInfo
          if (-not $tokenProcess.Start()) { throw 'gh token process failed to start' }
          $tokenOutput = $tokenProcess.StandardOutput.ReadToEnd()
          $tokenError = $tokenProcess.StandardError.ReadToEnd()
          $tokenProcess.WaitForExit()
          if ($tokenProcess.ExitCode -ne 0) { throw 'gh token process failed' }
          $ghToken = ([string]$tokenOutput).Trim()
          if ([string]::IsNullOrWhiteSpace($ghToken)) { throw 'gh token empty' }

          Write-Host "::add-mask::$ghToken"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$ghToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ghToken = $null
          $tokenOutput = $null
          $tokenError = $null
      - name: Reproduce Node materializeTarget fetch without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'kneekura-relay-node-fetch-probe.mjs'
          @'
          import childProcess from 'node:child_process';
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const repository = 'genkimorimori252525-oss/KNEEKURA-LAB';
          const revision = 'e96e40ab0fc7a8995a1972d8f9defb2aa894ad0e';
          const token = String(process.env.KNEEKURA_RELAY_GITHUB_TOKEN || '');
          console.log(`relay_token.present=${token.length > 0}`);
          if (!token) process.exit(2);

          const tempRoot = await fs.mkdtemp(path.join(os.tmpdir(), 'kneekura-node-fetch-probe-'));
          const targetRoot = path.join(tempRoot, 'target');
          await fs.mkdir(targetRoot, { recursive: true });
          const git = (cwd, args, env = process.env) => childProcess.execFileSync(
            'git', ['-C', cwd, ...args], {
              encoding: 'utf8',
              windowsHide: true,
              stdio: ['ignore', 'pipe', 'pipe'],
              env
            }
          );

          try {
            git(targetRoot, ['init']);
            git(targetRoot, ['remote', 'add', 'origin', `https://github.com/${repository}.git`]);
            const askpassPath = path.join(targetRoot, '.kneekura-relay-askpass.cmd');
            const askpassBytes = Buffer.from(
              '@echo off\r\necho %* | findstr /I "Username" >nul && (echo x-access-token& exit /b 0)\r\necho %KNEEKURA_RELAY_FETCH_TOKEN%\r\n',
              'utf8'
            );
            await fs.writeFile(askpassPath, askpassBytes);
            console.log(`askpass.utf8_bom=${askpassBytes.length >= 3 && askpassBytes[0] === 0xef && askpassBytes[1] === 0xbb && askpassBytes[2] === 0xbf}`);
            console.log(`askpass.crlf=${askpassBytes.includes(Buffer.from('\r\n'))}`);

            const env = {
              ...process.env,
              GIT_TERMINAL_PROMPT: '0',
              GCM_INTERACTIVE: 'Never',
              GIT_ASKPASS: askpassPath,
              KNEEKURA_RELAY_FETCH_TOKEN: token
            };

            let fetchError = null;
            try {
              git(targetRoot, ['-c', 'core.hooksPath=NUL', 'fetch', '--depth', '1', '--no-tags', 'origin', revision], env);
            } catch (error) {
              fetchError = error;
            }

            if (fetchError) {
              const stderr = String(fetchError.stderr || '').toLowerCase();
              console.log('git_fetch.ok=false');
              console.log(`git_fetch.status=${Number.isInteger(fetchError.status) ? fetchError.status : 'unknown'}`);
              console.log(`git_fetch.auth_failed=${stderr.includes('authentication failed')}`);
              console.log(`git_fetch.repository_not_found=${stderr.includes('repository not found')}`);
              console.log(`git_fetch.could_not_read_username=${stderr.includes('could not read username')}`);
              console.log(`git_fetch.askpass_spawn_failed=${stderr.includes('cannot spawn') || stderr.includes('could not run')}`);
              console.log(`git_fetch.terminal_prompt_disabled=${stderr.includes('terminal prompts disabled')}`);
              process.exitCode = 3;
            } else {
              const actual = git(targetRoot, ['rev-parse', 'FETCH_HEAD']).trim().toLowerCase();
              const type = git(targetRoot, ['--no-replace-objects', 'cat-file', '-t', actual]).trim();
              console.log('git_fetch.ok=true');
              console.log(`git_fetch.exact_commit=${actual === revision.toLowerCase() && type === 'commit'}`);
            }
          } finally {
            await fs.rm(tempRoot, { recursive: true, force: true }).catch(() => {});
          }
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          try {
            node $probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $probe -ErrorAction SilentlyContinue
          }
