name: Relay Credential Diagnostic One-Shot

on:
  push:
    branches:
      - jolly/github-relay-v1-credential-diag

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kneekura-code-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Relay runtime exactly as live workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2df98f8a2318d40348b4c52ef0a8f47b02c24f7
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Resolve same-owner credential exactly as live workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ghCommand = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $ghCommand) { throw 'gh unavailable' }
          $tokenProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $tokenProcessInfo.FileName = $ghCommand.Source
          $tokenProcessInfo.Arguments = 'auth token --hostname github.com'
          $tokenProcessInfo.UseShellExecute = $false
          $tokenProcessInfo.CreateNoWindow = $true
          $tokenProcessInfo.RedirectStandardOutput = $true
          $tokenProcessInfo.RedirectStandardError = $true
          $tokenProcess = New-Object System.Diagnostics.Process
          $tokenProcess.StartInfo = $tokenProcessInfo
          if (-not $tokenProcess.Start()) { throw 'gh token process failed to start' }
          $tokenOutput = $tokenProcess.StandardOutput.ReadToEnd()
          $tokenError = $tokenProcess.StandardError.ReadToEnd()
          $tokenProcess.WaitForExit()
          if ($tokenProcess.ExitCode -ne 0) { throw 'gh token process failed' }
          $ghToken = ([string]$tokenOutput).Trim()
          if ([string]::IsNullOrWhiteSpace($ghToken)) { throw 'gh token empty' }
          Write-Host "::add-mask::$ghToken"
          "KNEEKURA_RELAY_GITHUB_TOKEN=$ghToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ghToken = $null
          $tokenOutput = $null
          $tokenError = $null
      - name: Install pinned Code LAB dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full pinned Relay against real Issue 91 without publishing
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $issueFile = Join-Path $env:RUNNER_TEMP 'kneekura-relay-issue-91.json'
          $eventFile = Join-Path $env:RUNNER_TEMP 'kneekura-relay-event-91.json'
          $savedEventPath = $env:GITHUB_EVENT_PATH
          try {
            & gh api 'repos/genkimorimori252525-oss/KNEEKURA-CODE-LAB/issues/91' | Out-File -LiteralPath $issueFile -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'failed to read Issue 91' }
            $issue = Get-Content -Raw -Encoding UTF8 -LiteralPath $issueFile | ConvertFrom-Json
            $event = [ordered]@{
              action = 'opened'
              issue = $issue
              sender = $issue.user
            }
            $event | ConvertTo-Json -Depth 100 | Out-File -LiteralPath $eventFile -Encoding utf8
            $env:GITHUB_EVENT_PATH = $eventFile

            $savedPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & node scripts/run-kneekura-github-relay.mjs *> $null
              $relayExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedPreference
            }

            $turnPath = Join-Path $PWD 'dist\github-relay\turn.json'
            Write-Host "full_runtime.exit=$relayExit"
            Write-Host ('full_runtime.turn_exists=' + (Test-Path -LiteralPath $turnPath))
            if (Test-Path -LiteralPath $turnPath) {
              $turn = Get-Content -Raw -Encoding UTF8 -LiteralPath $turnPath | ConvertFrom-Json
              Write-Host ('full_runtime.failed=' + [bool]$turn.failed)
              Write-Host ('full_runtime.skipped=' + [bool]$turn.skipped)
              Write-Host ('full_runtime.replay_state=' + [string]$turn.replay_state)
              Write-Host ('full_runtime.run_id_present=' + (-not [string]::IsNullOrWhiteSpace([string]$turn.run_id)))
              $kinds = @($turn.comments | ForEach-Object { [string]$_.kind })
              Write-Host ('full_runtime.comment_kinds=' + ($kinds -join ','))

              if ($turn.failed -and $turn.comments.Count -gt 0) {
                $body = [string]$turn.comments[0].body
                $knownCodes = @(
                  'BLOCKED_TARGET_REPOSITORY_UNAVAILABLE',
                  'BLOCKED_TARGET_REVISION_MISMATCH',
                  'BLOCKED_TARGET_REVISION_INVALID',
                  'RELAY_GITHUB_API_FAILED',
                  'RELAY_INTERNAL_ERROR'
                )
                $matched = @($knownCodes | Where-Object { $body.Contains($_) })
                Write-Host ('full_runtime.error_code=' + $(if ($matched.Count) { $matched[0] } else { 'OTHER_BOUNDED_ERROR' }))
              }
            }
          } finally {
            $env:GITHUB_EVENT_PATH = $savedEventPath
            Remove-Item -Force $issueFile,$eventFile -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force (Join-Path $PWD 'dist\github-relay') -ErrorAction SilentlyContinue
          }
