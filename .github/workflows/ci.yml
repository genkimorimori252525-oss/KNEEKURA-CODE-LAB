name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Ordinary PR/push checks use GitHub-hosted Windows. Explicit live-profile
    # branches still need the pre-existing local target clones; never move those
    # repository-specific checks to a fresh hosted machine silently.
    runs-on: >-
      ${{ github.event_name == 'push' &&
          (startsWith(github.ref_name, 'feat/typescript-semantic-vertical') ||
           startsWith(github.ref_name, 'feat/love-github-human-guide-acceptance') ||
           startsWith(github.ref_name, 'feat/human-analysis-production-r1') ||
           startsWith(github.ref_name, 'feat/human-experience-system-map-r2') ||
           startsWith(github.ref_name, 'feat/human-analysis-r3-technical-views') ||
           startsWith(github.ref_name, 'feat/human-analysis-r4-repository-scale') ||
           startsWith(github.ref_name, 'feat/human-analysis-r5-production-golden')) &&
          fromJSON('["self-hosted","Windows","X64","kneekura-code-lab"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build deterministic KNEEKURA Code LAB Agent Skill package
        run: npm run skill:package
      - name: Install pinned MCP v2 adapter dependencies without lifecycle scripts
        run: npm install --prefix mcp --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Smoke-test MCP v2 server registration
        run: npm --prefix mcp run smoke
      - name: Build deterministic KNEEKURA Code LAB Plugin v1 package
        run: npm run plugin:package
      - name: Smoke-test generated Plugin MCP over stdio
        run: node scripts/smoke-kneekura-code-lab-plugin.mjs
      - name: Upload KNEEKURA Code LAB Plugin v1 package
        if: github.ref_name == 'jolly/skill-distribution-mcp-v1' || github.head_ref == 'jolly/skill-distribution-mcp-v1'
        uses: actions/upload-artifact@v4
        with:
          name: kneekura-code-lab-plugin-v1
          path: |
            dist/chatgpt-plugin/kneekura-code-lab-plugin-v1.zip
            dist/chatgpt-plugin/kneekura-code-lab-plugin-v1.zip.sha256
          if-no-files-found: error
      - name: Prepare pinned Archify v2.16.0
        if: github.event_name == 'push' && startsWith(github.ref_name, 'jolly/kneekura-code-lab-skill-v1')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'kneekura-archify-v2.16.0.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'kneekura-archify-v2.16.0'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tt-a1i/archify/c826e6c3a7abad19c0f3cd1ca57207d54b1ad8de/archify.zip' -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = '4c59fa6557a2385beaaef8c7219cc414573acc9f0c30a932d5053b0b20689a46'
          if ($actual -ne $expected) { throw "Pinned Archify sha256 mismatch: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $cli = Get-ChildItem -Path $dest -Recurse -File -Filter 'archify.mjs' | Where-Object { $_.FullName -match '[\\/]bin[\\/]archify\.mjs$' } | Select-Object -First 1
          if (-not $cli) { throw 'Pinned Archify CLI missing after extraction' }
          $archifyRoot = Split-Path -Parent (Split-Path -Parent $cli.FullName)
          "KNEEKURA_ARCHIFY_ROOT=$archifyRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KNEEKURA_ARCHIFY_ARTIFACT_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate pinned Archify native Skill engine
        if: github.event_name == 'push' && startsWith(github.ref_name, 'jolly/kneekura-code-lab-skill-v1')
        run: npm run validate:archify-native
      - name: Validate live Love-Github TypeScript vertical
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/typescript-semantic-vertical')
        run: npm run validate:love-github-typescript-live
      - name: Validate live Love-Github Human Guide acceptance
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/love-github-human-guide-acceptance')
        run: npm run validate:love-github-human-guide-live
      - name: Validate fixed Love-Github production R1
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-production-r1')
        run: npm run validate:love-github-human-guide-production-r1
      - name: Upload Love-Github production R1 artifact
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-production-r1')
        uses: actions/upload-artifact@v4
        with:
          name: love-github-r1-human-explorer
          path: dist/r1-love-github-production
          if-no-files-found: error
      - name: Validate fixed Love-Github R2 System Map
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-experience-system-map-r2')
        run: npm run validate:love-github-system-map-r2
      - name: Validate fixed Love-Github production R3 technical views
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r3-technical-views')
        run: npm run validate:love-github-human-guide-production-r3
      - name: Upload Love-Github production R3 artifact
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r3-technical-views')
        uses: actions/upload-artifact@v4
        with:
          name: love-github-r3-human-explorer
          path: dist/r3-love-github-production
          if-no-files-found: error
      - run: npm run presentation:guard
      - run: npm run test:presentation-p1
      - run: npm run test:presentation-p2
      - run: npm run test:presentation-p3
      - run: npm run test:presentation-p4
      - run: npm run test:presentation-guided-tour
      - run: npm run test:presentation-change-impact
      - run: npm run test:presentation-ask-graph
      - run: npm run test:presentation-confidence-evidence
      - run: npm run test:ai-human-analysis-contract
      - run: npm run explorer:build
      - name: Validate standalone Human Explorer in Chrome via file://
        run: node scripts/validate-human-explorer-file-browser.mjs
      - run: node src/cli.mjs scan fixtures/forge-mini --understand fixtures/understand-anything --out dist/graph.json
      - run: node src/cli.mjs workspace --repo tlm=fixtures/workspace/tlm --repo ysm=fixtures/workspace/ysm --out dist/workspace.json
      - run: node src/cli.mjs scan fixtures/forge-mini --trace fixtures/runtime/kneekura-trace.jsonl --out dist/runtime-overlay.json
      - run: node src/cli.mjs scan fixtures/forge-mini --trace fixtures/runtime/kneekura-trace.jsonl --pose fixtures/runtime/kneekura.pose.json --out dist/runtime-pose-overlay.json
      - run: node src/cli.mjs scan fixtures/forge-mini --trace fixtures/runtime/kneekura-trace.jsonl --net fixtures/runtime/kneekura-server.net.jsonl --net fixtures/runtime/kneekura-client.net.jsonl --out dist/runtime-network-overlay.json
      - run: node src/cli.mjs scan fixtures/workspace/ysm --trace fixtures/runtime/kneekura-trace.jsonl --pose fixtures/runtime/kneekura.pose.json --palette fixtures/runtime/kneekura.pal.json --out dist/runtime-bone-overlay.json
      - name: Use Node 22 for fixed Love-Github R4 replay
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r4-repository-scale')
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reinstall locked KNEEKURA dependencies under Node 22
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r4-repository-scale')
        run: npm ci --no-audit --no-fund
      - name: Validate fixed Love-Github production R4 repository scale
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r4-repository-scale')
        env:
          NODE_OPTIONS: --max-old-space-size=960
        run: npm run validate:love-github-human-guide-production-r4
      - name: Upload Love-Github production R4 artifact
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r4-repository-scale')
        uses: actions/upload-artifact@v4
        with:
          name: love-github-r4-human-explorer
          path: dist/r4-love-github-production
          if-no-files-found: error
      - name: Use Node 22 for final Love-Github R5 production golden
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r5-production-golden')
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reinstall locked KNEEKURA dependencies for R5
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r5-production-golden')
        run: npm ci --no-audit --no-fund
      - name: Validate final Love-Github R5 production golden
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r5-production-golden')
        env:
          NODE_OPTIONS: --max-old-space-size=960
        run: npm run validate:love-github-human-guide-production-r5
      - name: Upload final Love-Github R5 production golden
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/human-analysis-r5-production-golden')
        uses: actions/upload-artifact@v4
        with:
          name: love-github-r5-production-golden
          path: dist/r4-love-github-production
          if-no-files-found: error
      - name: Use Node 22 for pinned Understand Anything v2.9.0
        if: github.event_name == 'push' && startsWith(github.ref_name, 'jolly/kneekura-code-lab-skill-v1')
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned Understand Anything v2.9.0
        if: github.event_name == 'push' && startsWith(github.ref_name, 'jolly/kneekura-code-lab-skill-v1')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedCommit = 'f08763d11d0202a8a8f52b5dedda6d1b2e2ebac8'
          $dest = Join-Path $env:RUNNER_TEMP 'kneekura-understand-anything-v2.9.0'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest | Out-Null
          git -C $dest init
          git -C $dest remote add origin 'https://github.com/Egonex-AI/Understand-Anything.git'
          git -C $dest fetch --depth 1 origin 'refs/tags/v2.9.0'
          git -C $dest checkout --detach FETCH_HEAD
          $actualCommit = (git -C $dest rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualCommit -ne $expectedCommit) { throw "Pinned UA commit mismatch: $actualCommit" }
          $pluginTree = (git -C $dest rev-parse 'HEAD:understand-anything-plugin').Trim().ToLowerInvariant()
          if ($pluginTree -ne 'c79dd16babb26a39aca4a15156bc488bcfc69587') { throw "Pinned UA plugin tree mismatch: $pluginTree" }
          $checks = @{
            'understand-anything-plugin/package.json' = 'e06bc5863abcafdd9c4108e34cbbf5fd6448cedf'
            'understand-anything-plugin/pnpm-lock.yaml' = 'fd4cf7539627856d6b166c39dc1041165fa2ce87'
            'understand-anything-plugin/skills/understand/SKILL.md' = '99bede1a9a7e008e621011d6c984a6b97518946f'
            'LICENSE' = '5df102e8a2e29cdfb881ae7ec5040f2766564680'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            $actual = (git -C $dest hash-object $entry.Key).Trim().ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Pinned UA blob mismatch for $($entry.Key): $actual" }
          }
          corepack enable
          corepack prepare pnpm@10.6.2 --activate
          Push-Location $dest
          try {
            pnpm install --frozen-lockfile
            pnpm --filter '@understand-anything/core' build
            pnpm --filter '@understand-anything/dashboard' build
          } finally { Pop-Location }
          $dashboard = Join-Path $dest 'understand-anything-plugin\packages\dashboard\dist'
          if (-not (Test-Path (Join-Path $dashboard 'index.html'))) { throw 'Pinned UA dashboard build missing index.html' }
          "KNEEKURA_UA_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KNEEKURA_UA_DASHBOARD_ROOT=$dashboard" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate pinned Understand Anything native Skill engine
        if: github.event_name == 'push' && startsWith(github.ref_name, 'jolly/kneekura-code-lab-skill-v1')
        run: npm run validate:ua-native